name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          find . -name "*.sh" -not -path "*/node_modules/*" -exec shellcheck {} +
      - name: Install shfmt
        run: |
          curl -sSLo shfmt https://github.com/mvdan/sh/releases/download/v3.7.0/shfmt_v3.7.0_linux_amd64
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/
      - name: Run shfmt
        run: |
          find . -name "*.sh" -not -path "*/node_modules/*" -exec shfmt -d {} +

  docker-tests:
    name: Docker Matrix Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, debian]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build and Run Docker Test
        run: |
          chmod +x ./tests/docker/run-tests.sh
          ./tests/docker/run-tests.sh ${{ matrix.os }}
